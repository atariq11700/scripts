# unbound DNS64 resolver config (used by ezwifi_ap.sh when -i is given with -6).
# dnsmasq forwards client queries here; unbound recurses over the IPv4 uplink
# and synthesizes AAAA records into the NAT64 prefix so IPv6-only clients can
# reach the IPv4-only internet via the NAT64 translator (tayga).
server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5354
    # Host is reached over IPv4; never try to talk upstream over IPv6.
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    # Only dnsmasq (on this host) queries us.
    access-control: 127.0.0.1/32 allow
    # Run in-place as the invoking (root) user; no chroot/privilege drop. Paths
    # live under /etc/unbound and /run because unbound's AppArmor profile only
    # permits those (not the repo path or /tmp).
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: "/run/unbound.pid"
    use-syslog: no
    logfile: ""
    # DNS64: synthesize AAAA into 64:ff9b::/96. synthall=yes forces synthesis
    # even when a real AAAA exists, so on an IPv4-only uplink (no native IPv6
    # route) every IPv6 destination goes through NAT64 and stays reachable.
    module-config: "dns64 iterator"
    dns64-prefix: 64:ff9b::/96
    dns64-synthall: yes
forward-zone:
    name: "."
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4
