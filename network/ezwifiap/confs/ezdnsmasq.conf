# ==============================================================================
# Filename:         ezdnsmasq.conf
# Description:      dnsmasq config template for ezwifiap.sh providing DHCPv4,
#                   DHCPv6, RA, and DNS forwarding.
# Author:           Adam A https://github.com/atariq11700
# Date Created:     2026-10-21
# License:          AGPL-3.0
# ==============================================================================

interface=@interface@
except-interface=lo
# bind-dynamic (not bind-interfaces): bind-interfaces only listens on the
# interface's unicast addresses, so dnsmasq never receives the IPv6 multicast
# Router Solicitations (ff02::2) or DHCPv6 Solicits (ff02::1:2) and therefore
# never sends RAs or DHCPv6 replies. bind-dynamic joins the required multicast
# groups per interface, which is what makes RA + DHCPv6 actually work.
bind-dynamic

#@IPV4-BEGIN@
# --- IPv4 ---
dhcp-range=@lowerip@,@upperip@,@leasetime@
dhcp-option=option:router,@interfaceip@
#@IPV4-END@

#@IPV6-BEGIN@
# --- IPv6 (ULA: served locally, independent of the host's upstream IPv6) ---
# Emit Router Advertisements so clients can autoconfigure via SLAAC and learn
# that a DHCPv6 server is present on this link.
enable-ra
# The dhcp-range line below is generated by ezwifi_ap.sh from the -m mode
# (slaac / dhcpv6 / both): a stateful pool with an optional slaac keyword, or an
# ra-only range for pure SLAAC. We advertise the prefix explicitly (rather than
# constructor:<iface>) so clients always get a usable prefix even if dnsmasq
# starts before the interface address settles.
@ip6dhcprange@
# Advertise ourselves as the IPv6 resolver (dnsmasq also emits RDNSS in its RAs).
dhcp-option=option6:dns-server,[@interfaceip6@]
#@IPV6-END@

# --- Upstream DNS ---
# The upstream server line(s) are appended by ezwifi_ap.sh: the public resolvers
# for a plain setup, or the local DNS64 resolver (unbound) when NAT64 is active.
no-resolv
log-queries