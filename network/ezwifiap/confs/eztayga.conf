# Tayga NAT64 translator config (used by ezwifi_ap.sh when -i is given with -6).
# Translates client IPv6 traffic destined for the well-known NAT64 prefix
# 64:ff9b::/96 into IPv4, which then egresses (masqueraded) via the uplink.
tun-device nat64
# All addresses below are filled in by ezwifi_ap.sh so they track the user's
# flags and can never clash with the chosen client subnet (-a) or prefix (-p):
#   @tayga_ipv4@ / @tayga_pool@ - tayga's own IPv4 and the pool it draws per-
#     client mappings from. CGN space (RFC 6598), kept off the client's -a net.
#   @tayga_ipv6@ - the nat64 device's IPv6, used only as the source of the
#     ICMPv6 errors tayga emits (required because the prefix is 64:ff9b::/96 and
#     ipv4-addr is private). Placed in a sibling /64 of the client prefix so it
#     can never overlap the client /64 or its DHCPv6 pool (-D).
ipv4-addr @tayga_ipv4@
ipv6-addr @tayga_ipv6@
prefix 64:ff9b::/96
dynamic-pool @tayga_pool@
data-dir /tmp/ezwifi_tayga
